# Hiring Stage Fixtures - T073
#
# FIXTURES PHILOSOPHY:
# - Fixtures represent realistic, stable test data
# - Stages belong to hiring processes and are ordered by position
# - Named semantically to make tests readable
# - Use ERB for dynamic values like timestamps
#
# FIXTURE NAMING:
# - Format: <process_name>_<stage_name>
# - Examples: default_application, default_phone_screen, executive_board_interview
# - Makes test code self-documenting: hiring_stages(:default_application)
#
# STAGE TYPES:
# - application (0): Initial submission and review stages
# - interview (1): Interview and assessment stages
# - decision (2): Final decision, offer, and onboarding stages

# =============================================================================
# DEFAULT PROCESS STAGES (4 stages)
# =============================================================================
# Standard hiring workflow for most roles

# STAGE 1: Application Review
# TYPE: application
# PURPOSE: Initial screening of applications
default_application:
  hiring_process: default_process
  name: Application Review
  stage_type: 0  # application
  position: 1
  required: true
  settings: { "auto_advance": false, "review_deadline_days": 7 }
  created_at: <%= 60.days.ago %>
  updated_at: <%= 10.days.ago %>

# STAGE 2: Phone Screen
# TYPE: interview
# PURPOSE: Quick phone call to assess basic fit
default_phone_screen:
  hiring_process: default_process
  name: Phone Screen
  stage_type: 1  # interview
  position: 2
  required: true
  settings: { "duration_minutes": 30, "interview_type": "phone" }
  created_at: <%= 60.days.ago %>
  updated_at: <%= 10.days.ago %>

# STAGE 3: Technical Interview
# TYPE: interview
# PURPOSE: In-depth technical assessment
default_technical:
  hiring_process: default_process
  name: Technical Interview
  stage_type: 1  # interview
  position: 3
  required: true
  settings: { "duration_minutes": 90, "interview_type": "technical" }
  created_at: <%= 60.days.ago %>
  updated_at: <%= 10.days.ago %>

# STAGE 4: Final Decision
# TYPE: decision
# PURPOSE: Make hiring decision
default_decision:
  hiring_process: default_process
  name: Final Decision
  stage_type: 2  # decision
  position: 4
  required: true
  settings: { "requires_approval": true }
  created_at: <%= 60.days.ago %>
  updated_at: <%= 10.days.ago %>

# =============================================================================
# EXECUTIVE PROCESS STAGES (4 stages)
# =============================================================================
# Executive hiring workflow for senior leadership

# STAGE 1: Application Review
executive_application:
  hiring_process: executive_process
  name: Application Review
  stage_type: 0  # application
  position: 1
  required: true
  settings: { "auto_advance": false, "review_deadline_days": 3 }
  created_at: <%= 45.days.ago %>
  updated_at: <%= 5.days.ago %>

# STAGE 2: Executive Interview
executive_interview:
  hiring_process: executive_process
  name: Executive Interview
  stage_type: 1  # interview
  position: 2
  required: true
  settings: { "duration_minutes": 60, "interview_type": "executive" }
  created_at: <%= 45.days.ago %>
  updated_at: <%= 5.days.ago %>

# STAGE 3: Board Interview
executive_board_interview:
  hiring_process: executive_process
  name: Board Interview
  stage_type: 1  # interview
  position: 3
  required: true
  settings: { "duration_minutes": 120, "interview_type": "panel" }
  created_at: <%= 45.days.ago %>
  updated_at: <%= 5.days.ago %>

# STAGE 4: Final Decision
executive_decision:
  hiring_process: executive_process
  name: Final Decision
  stage_type: 2  # decision
  position: 4
  required: true
  settings: { "requires_approval": true, "board_approval_required": true }
  created_at: <%= 45.days.ago %>
  updated_at: <%= 5.days.ago %>

