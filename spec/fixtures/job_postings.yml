  position_template: software_engineer
  location: acme_hq
  hiring_process: default_process
  job_title: Backend Engineer - Payments Team
  description: >
    We're looking for an experienced backend engineer to join our payments team.
    You'll work on building scalable payment processing systems using Ruby on Rails,
    PostgreSQL, and Redis. This is a high-impact role working on critical infrastructure.
  requirements: >
    - 5+ years of Ruby on Rails experience
    - Strong understanding of payment processing and financial systems
    - Experience with PostgreSQL, Redis, and background job processing
    - Excellent problem-solving and debugging skills
    - Strong communication and collaboration skills
  status: 1  # published
  published_at: <%= 7.days.ago %>
  unpublished_at: null
  closed_at: null
  created_at: <%= 10.days.ago %>
  updated_at: <%= 7.days.ago %>

