# Job Posting Fixtures - T074
#
# FIXTURES PHILOSOPHY:
# - Fixtures represent realistic, stable test data
# - They're shared across all tests, reducing duplication
# - Named semantically to make tests readable
# - Use ERB for dynamic values like timestamps
#
# MULTI-TENANT DESIGN:
# - All job postings belong to brand :acme (from brands.yml)
# - Tests verify brand scoping works correctly
# - Cross-brand access tests use brand :globex
#
# FIXTURE NAMING:
# - Use descriptive names that indicate the posting's status and role
# - Examples: backend_engineer_published, sales_rep_draft, intern_link_only
# - Makes test code self-documenting: job_postings(:backend_engineer_published)
#
# STATUS VALUES (AASM enum):
# - draft (0): Not yet published, work in progress
# - published (1): Live on careers page, accepting applications
# - link_only (2): Only accessible via direct link, not on public careers page
# - unpublished (3): Removed from careers page, no longer accepting applications

# =============================================================================
# PUBLISHED JOB POSTINGS (Active on careers page)
# =============================================================================

# PUBLISHED: Backend Engineer
# PURPOSE: Test published job posting with recent publish date
# USAGE: Primary test case for active job listings
# TEMPLATE: Software Engineer Template
# LOCATION: San Francisco HQ
# STATUS: published (1)
