# Applicant Fixtures - T111
#
# FIXTURES PHILOSOPHY:
# - Fixtures represent realistic, stable test data
# - They're shared across all tests, reducing duplication
# - Named semantically to make tests readable
# - Use ERB for dynamic values like timestamps
#
# MULTI-TENANT DESIGN:
# - All applicants belong to brand :acme (from brands.yml)
# - Tests verify brand scoping works correctly
# - Cross-brand access tests use brand :globex
#
# FIXTURE NAMING:
# - Use descriptive names that indicate the applicant's role in tests
# - Examples: john_doe, jane_smith, flagged_applicant
# - Makes test code self-documenting: applicants(:john_doe)
#
# APPLICANT SOURCES:
# - linkedin: Applied via LinkedIn integration
# - referral: Employee referral
# - careers_page: Applied via public careers page
# - job_board: Applied via external job board

# =============================================================================
# PRIMARY APPLICANTS (For general testing)
# =============================================================================

# APPLICANT: John Doe
# PURPOSE: Primary test applicant for most test scenarios
# USAGE: Use for application submission, hiring, rejection tests
# SOURCE: linkedin
john_doe:
  brand: acme
  first_name: John
  last_name: Doe
  email: john.doe@example.com
  phone: '+1-555-0100'
  preferred_language: en
  source: linkedin
  flagged: false
  flag_reason: null
  created_at: <%= 30.days.ago %>
  updated_at: <%= 20.days.ago %>

