# Application Fixtures - T112
#
# FIXTURES PHILOSOPHY:
# - Fixtures represent realistic, stable test data
# - They're shared across all tests, reducing duplication
# - Named semantically to make tests readable
# - Use ERB for dynamic values like timestamps
#
# MULTI-TENANT DESIGN:
# - All applications belong to brand :acme (from brands.yml)
# - Tests verify brand scoping works correctly
# - Cross-brand access tests use brand :globex
#
# FIXTURE NAMING:
# - Use descriptive names that indicate the application's status and role
# - Examples: pending_application, hired_application, rejected_application
# - Makes test code self-documenting: applications(:pending_application)
#
# STATUS VALUES (AASM enum):
# - in_progress (0): Application being reviewed/processed
# - hired (1): Applicant was hired
# - rejected (2): Applicant was rejected
# - archived (3): Application archived (no longer active)
#
# RELATIONSHIPS:
# - Each application belongs to: brand, applicant, job_posting, hiring_process
# - current_stage: Current position in hiring process
# - hired_by/rejected_by: User who made the decision

