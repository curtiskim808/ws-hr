# Position Template Fixtures - DHH/37signals Style
#
# FIXTURES PHILOSOPHY:
# - Fixtures represent realistic, stable test data
# - They're shared across all tests, reducing duplication
# - Named semantically to make tests readable
# - Use ERB for dynamic values like timestamps
#
# MULTI-TENANT DESIGN:
# - All templates belong to brand :acme (from brands.yml)
# - Tests verify brand scoping works correctly
# - Cross-brand access tests use brand :globex
#
# FIXTURE NAMING:
# - Use descriptive names that indicate the template's purpose
# - Examples: software_engineer, sales_rep, customer_support
# - Makes test code self-documenting: position_templates(:software_engineer)

# ACTIVE TEMPLATE: Software Engineer
# PURPOSE: Test the most common scenario - active engineering role
# USAGE: Default template for most positive test cases
software_engineer:
  brand: acme
  name: Software Engineer Template
  job_title: Senior Software Engineer - Backend
  category: Engineering
  department: Product Development
  description: >
    We're looking for an experienced backend engineer to join our product team.
    You'll work on building scalable APIs and services using Ruby on Rails.
  requirements: >
    - 5+ years of Ruby on Rails experience
    - Strong understanding of RESTful API design
    - Experience with PostgreSQL and Redis
    - Excellent problem-solving skills
    - Strong communication skills
  location_type: hybrid
  employment_type: full_time
  education_requirement: bachelor
  status: 1  # active (enum value)
  created_at: <%= 30.days.ago %>
  updated_at: <%= 5.days.ago %>

