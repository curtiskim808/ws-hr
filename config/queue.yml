default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Critical queue (priority 2) - urgent notifications
    - queues: critical
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Default queue (priority 1) - standard operations
    - queues: default
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Notifications queue (priority 1) - async notifications
    - queues: notifications
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
